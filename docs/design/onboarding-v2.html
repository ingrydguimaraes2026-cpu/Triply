<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Primeiro uso da Norti</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Protótipo do primeiro uso, versão 2 (reescrita do zero em 09/11/2026).
   Base: docs/ONBOARDING-referencias-2026-11-09.md. Só desenho: dá pra clicar, nada é salvo. */
:root{
  --couro:#7B542F;--couro-esc:#4A2E14;--noite:#1E120A;--noite2:#2A1A0C;--caramelo:#B97A22;--dourado:#E3A04A;--ouro:#FFC93C;
  --creme:#F5E9D6;--fundo:#FBF3E6;--chip:#F6EAD7;--borda:#EADCC6;--texto:#3B2715;--suave:#7A5F45;--verde:#5E6B2E;--zap:#25D366;
  --mola:cubic-bezier(.34,1.56,.64,1);--suave-saida:cubic-bezier(.22,1,.36,1)
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:radial-gradient(1200px 700px at 30% -10%,#3a2412 0%,var(--noite) 60%) fixed;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--creme);padding:24px 16px 56px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
.f{font-family:'Fraunces',serif;letter-spacing:-.02em}

/* ---------- página em volta ---------- */
.topo{max-width:1080px;margin:0 auto 20px;display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between}
.topo h1{font:900 30px/1 'Fraunces',serif}
.topo p{color:#d9c3a2;font-size:14px;margin-top:6px;max-width:560px;line-height:1.5}
.trilhos{display:flex;background:#2f1d0e;border:1px solid #4a3220;border-radius:999px;padding:4px}
.trilhos button{padding:9px 16px;border-radius:999px;font-weight:700;font-size:13px;color:#d9c3a2;transition:.25s}
.trilhos button[aria-pressed=true]{background:var(--creme);color:var(--couro-esc)}
.palco{max-width:1080px;margin:0 auto;display:flex;gap:36px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.notas{flex:1;min-width:280px;max-width:470px;position:sticky;top:24px}
.notas .etapa{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--dourado)}
.notas h2{font:700 26px/1.1 'Fraunces',serif;margin:6px 0 12px}
.notas .porque{font-size:15px;line-height:1.55;color:#ecdcc4}
.notas .porque p+p{margin-top:10px}
.notas .porque b{color:#fff}
.notas .ref{margin-top:14px;padding:12px 14px;border-radius:14px;background:#2f1d0e;border:1px solid #4a3220;font-size:13px;color:#d9c3a2;line-height:1.45}
.notas .ref strong{color:var(--dourado);font-size:11px;letter-spacing:.12em;text-transform:uppercase;display:block;margin-bottom:4px}
.passos{margin-top:18px;display:flex;flex-wrap:wrap;gap:6px}
.passos button{padding:7px 12px;border-radius:999px;border:1px solid #4a3220;font-size:12px;font-weight:700;color:#bfa585}
.passos button[aria-current=true]{background:var(--dourado);border-color:var(--dourado);color:var(--noite)}
.reiniciar{margin-top:12px;font-size:13px;color:#bfa585;text-decoration:underline}

/* ---------- celular ---------- */
.cel{width:min(375px,100%);height:780px;border-radius:52px;padding:10px;background:linear-gradient(145deg,#3b2a1c,#120a04);box-shadow:0 40px 80px rgba(0,0,0,.55),inset 0 0 0 1.5px #5b4330;flex:none}
.vidro{position:relative;width:100%;height:100%;border-radius:43px;overflow:hidden;background:var(--fundo);isolation:isolate}
.ilha{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:104px;height:30px;border-radius:20px;background:#000;z-index:60}
.status{position:absolute;top:0;left:0;right:0;height:50px;display:flex;justify-content:space-between;align-items:center;padding:4px 30px 0;font-size:14px;font-weight:700;z-index:55;pointer-events:none;color:var(--texto);transition:color .3s}
.vidro.escuro .status{color:#fff}
.tela{position:absolute;inset:0;display:flex;flex-direction:column;padding:58px 22px 26px}
.tela.entra{animation:entra .5s var(--suave-saida) both}
.tela.volta{animation:volta .5s var(--suave-saida) both}
@keyframes entra{from{opacity:0;transform:translateX(40px)}}
@keyframes volta{from{opacity:0;transform:translateX(-40px)}}
.cai{animation:cai .6s var(--suave-saida) both}
@keyframes cai{from{opacity:0;transform:translateY(18px)}}
.pop{animation:pop .5s var(--mola) both}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
.parado .cai,.parado .pop,.parado .balao,.parado .roda .amigo .rosto{animation:none}
.parado .roda .amigo.novo .rosto{animation:pop .5s var(--mola) both}
.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}.d4{animation-delay:.32s}.d5{animation-delay:.4s}.d6{animation-delay:.48s}
.espaco{flex:1}

.botao{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:58px;border-radius:20px;background:var(--couro-esc);color:var(--creme);font-weight:800;font-size:17px;box-shadow:0 10px 24px rgba(74,46,20,.35);transition:transform .15s,opacity .3s}
.botao:active{transform:scale(.97)}
.botao:disabled{opacity:.25;box-shadow:none}
.botao.claro{background:var(--creme);color:var(--couro-esc);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.botao.zap{background:var(--zap);color:#062b14;box-shadow:0 10px 24px rgba(37,211,102,.35)}
.botao.ouro{background:var(--ouro);color:var(--noite);box-shadow:0 10px 30px rgba(255,201,60,.35)}
.link{display:block;width:100%;text-align:center;padding:14px 0 0;font-weight:700;font-size:15px;color:var(--suave)}
.escuro .link{color:#e6d3b8}
.voltar{width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 2px 8px rgba(74,46,20,.1);flex:none}
.cabeca{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.barra-prog{flex:1;height:8px;border-radius:8px;background:var(--borda);overflow:hidden}
.barra-prog i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--caramelo),var(--dourado));transition:width .6s var(--suave-saida)}

/* Norti falando (estilo anfitrião) */
.fala{display:flex;align-items:flex-end;gap:6px;margin-bottom:16px}
.fala img{width:74px;height:74px;object-fit:contain;flex:none;margin-bottom:-6px;filter:drop-shadow(0 6px 8px rgba(74,46,20,.18))}
.balao{position:relative;background:#fff;border-radius:20px 20px 20px 6px;padding:12px 16px;font-weight:700;font-size:17px;line-height:1.3;color:var(--texto);box-shadow:0 6px 18px rgba(74,46,20,.1);animation:pop .45s var(--mola) both;transform-origin:0 100%}
.balao small{display:block;font-weight:500;font-size:13px;color:var(--suave);margin-top:3px}

/* ---------- 0. abertura em stories ---------- */
.stories{background:var(--noite);color:#fff;padding:0}
.stories .barras{position:absolute;top:52px;left:16px;right:16px;display:flex;gap:5px;z-index:5}
.stories .barras i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden}
.stories .barras i b{display:block;height:100%;width:0;background:#fff}
.stories .barras i.feito b{width:100%}
.stories .barras i.agora b{animation:enche var(--dur) linear forwards}
@keyframes enche{to{width:100%}}
.cena{position:absolute;inset:0;padding:80px 24px 0;overflow:hidden}
.cena h2{font:900 38px/1 'Fraunces',serif;letter-spacing:-.03em;position:relative;z-index:3}
.cena h2 em{font-style:normal;color:var(--ouro)}
.cena .sub{color:#e6d3b8;font-size:16px;margin-top:10px;line-height:1.4;max-width:290px;position:relative;z-index:3}
.toques{position:absolute;inset:0;display:flex;z-index:4}
.toques button{flex:1}
.rodape-stories{position:absolute;left:22px;right:22px;bottom:26px;z-index:6}
.marca{display:flex;align-items:center;gap:8px;font:900 20px 'Fraunces',serif;margin-bottom:14px}
.marca img{width:34px;height:34px;object-fit:contain}

/* cena A: o grupo bagunçado */
.chat{position:absolute;left:18px;right:18px;top:250px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:78%;padding:9px 13px;border-radius:16px;font-size:14px;line-height:1.3;background:#2d2d2d;color:#f2f2f2;opacity:0;animation:msg .4s var(--mola) forwards}
.msg b{display:block;font-size:11px;margin-bottom:2px}
.msg.eu{align-self:flex-end;background:#005c4b}
@keyframes msg{from{opacity:0;transform:translateY(14px) scale(.9)}to{opacity:1;transform:none}}
.chat.some .msg{animation:somemsg .5s forwards;}
@keyframes somemsg{from{opacity:1}to{opacity:.12;filter:blur(3px);transform:scale(.96)}}
.cartao-certo{position:absolute;left:26px;right:26px;top:330px;background:var(--creme);color:var(--texto);border-radius:24px;padding:18px;box-shadow:0 30px 60px rgba(0,0,0,.5);opacity:0;animation:sobecard .7s var(--mola) forwards;z-index:3}
@keyframes sobecard{from{opacity:0;transform:translateY(60px) rotate(-4deg) scale(.9)}to{opacity:1;transform:rotate(-2deg)}}
.cartao-certo small{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--caramelo)}
.cartao-certo .grande{font:900 34px/1 'Fraunces',serif;margin:6px 0 2px}
.cartao-certo .viram{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;font-weight:700;color:var(--verde)}

/* cena B: contas */
.recibos{position:absolute;left:0;right:0;top:250px;height:260px}
.recibo{position:absolute;background:#fff;color:var(--texto);border-radius:14px;padding:10px 14px;font-size:14px;font-weight:700;box-shadow:0 14px 30px rgba(0,0,0,.4);display:flex;gap:14px;justify-content:space-between;width:190px;opacity:0;animation:voarecibo 2.8s var(--suave-saida) forwards}
.recibo span{color:var(--suave);font-weight:600}
@keyframes voarecibo{0%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(.8)}12%,62%{opacity:1;transform:translate(var(--x),var(--y)) rotate(var(--r))}100%{opacity:0;transform:translate(70px,150px) rotate(0) scale(.4)}}
.saldo{position:absolute;left:24px;right:24px;top:400px;border-radius:26px;padding:20px;background:linear-gradient(135deg,var(--ouro),var(--dourado));color:var(--noite);opacity:0;animation:pop .6s var(--mola) 3s forwards;box-shadow:0 30px 60px rgba(255,201,60,.25)}
.saldo small{font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.saldo .grande{font:900 40px/1 'Fraunces',serif;margin-top:6px}
.saldo .linha{font-weight:700;font-size:14px;margin-top:6px}

/* cena C: carimbos */
.pagina-pass{position:absolute;left:30px;right:30px;top:248px;height:300px;border-radius:18px;background:linear-gradient(#f8eedc,#efdfc4);box-shadow:0 30px 60px rgba(0,0,0,.5);transform:rotate(2deg);overflow:hidden}
.pagina-pass::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 23px,rgba(123,84,47,.08) 23px 24px)}
.carimbo{position:absolute;width:112px;height:112px;border-radius:50%;border:3.5px solid currentColor;display:grid;place-items:center;text-align:center;font-weight:900;font-size:12px;letter-spacing:.08em;text-transform:uppercase;line-height:1.15;opacity:0;animation:carimba .45s cubic-bezier(.2,1.6,.4,1) forwards;mix-blend-mode:multiply}
.carimbo::after{content:"";position:absolute;inset:6px;border-radius:50%;border:1.5px dashed currentColor}
.carimbo span{font:900 17px/1 'Fraunces',serif;letter-spacing:0;text-transform:none;display:block;margin:3px 0}
.carimbo.quadrado{border-radius:16px}.carimbo.quadrado::after{border-radius:11px}
@keyframes carimba{0%{opacity:0;transform:scale(2.2) rotate(var(--r))}70%{opacity:.95;transform:scale(.94) rotate(var(--r))}100%{opacity:.9;transform:scale(1) rotate(var(--r))}}
.treme{animation:treme .25s 1}
@keyframes treme{25%{transform:rotate(2deg) translate(2px,1px)}75%{transform:rotate(2deg) translate(-2px,-1px)}}

/* ---------- rostos ---------- */
.rosto{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;flex:none;border:3px solid var(--fundo);position:relative}
.rosto.apagado{filter:grayscale(1);opacity:.45}
.rosto.tracejado{background:transparent!important;border:2px dashed currentColor;color:inherit;opacity:.6}
.fila-rostos{display:flex}
.fila-rostos .rosto{margin-right:-12px}

/* ---------- 1. pra onde ---------- */
.busca{display:flex;align-items:center;gap:10px;height:56px;border-radius:18px;background:#fff;padding:0 16px;box-shadow:0 4px 14px rgba(74,46,20,.08);border:2px solid transparent;transition:.2s}
.busca:focus-within{border-color:var(--dourado)}
.busca input{flex:1;border:0;outline:none;background:none;font-weight:700;font-size:17px;color:var(--texto)}
.cartoes-lugar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;overflow-y:auto;padding:2px 2px 10px;margin-left:-2px;margin-right:-2px}
.lugar{position:relative;height:118px;border-radius:20px;overflow:hidden;text-align:left;padding:12px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;transition:transform .35s var(--mola),box-shadow .3s;box-shadow:0 6px 16px rgba(74,46,20,.15)}
.lugar svg{position:absolute;inset:0;width:100%;height:100%}
.lugar b{position:relative;font:900 19px/1 'Fraunces',serif;overflow-wrap:anywhere;text-shadow:0 2px 10px rgba(0,0,0,.25)}
.lugar small{position:relative;font-size:12px;font-weight:700;opacity:.9;margin-top:3px}
.lugar[aria-pressed=true]{transform:scale(1.04);box-shadow:0 0 0 3px var(--fundo),0 0 0 6px var(--dourado),0 14px 30px rgba(74,46,20,.3)}
.lugar .ok{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;background:#fff;color:var(--couro-esc);display:grid;place-items:center;transform:scale(0);transition:transform .35s var(--mola)}
.lugar[aria-pressed=true] .ok{transform:scale(1)}
.rodape{padding-top:12px;transition:transform .45s var(--mola),opacity .3s}
.rodape.escondido{transform:translateY(120%);opacity:0;pointer-events:none}

/* ---------- 2. quando ---------- */
.contador{display:flex;align-items:baseline;gap:10px;justify-content:center;margin:2px 0 12px}
.contador .num{font:900 64px/1 'Fraunces',serif;color:var(--couro-esc);display:inline-block}
.contador .num.mudou{animation:pop .4s var(--mola)}
.contador span{font-weight:700;color:var(--suave)}
.cal{background:#fff;border-radius:22px;padding:14px;box-shadow:0 4px 14px rgba(74,46,20,.08)}
.cal .mes{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:15px;margin-bottom:8px;color:var(--texto)}
.cal .sem,.cal .dias{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.cal .sem{font-size:11px;font-weight:800;color:var(--suave);margin-bottom:4px}
.cal .dias button{height:38px;font-weight:700;font-size:14px;color:var(--texto);position:relative}
.cal .dias button:disabled{color:#cdbca4}
.cal .dias button.meio{background:#fbebd2}
.cal .dias button.ponta{color:#fff}
.cal .dias button.ponta::before{content:"";position:absolute;inset:2px;border-radius:50%;background:var(--couro-esc);z-index:-1;animation:pop .3s var(--mola)}
.cal .dias button.ini{background:linear-gradient(90deg,transparent 50%,#fbebd2 50%)}
.cal .dias button.fim{background:linear-gradient(90deg,#fbebd2 50%,transparent 50%)}
.cal .dias button.ini.fim{background:none}
.cal .dias{isolation:isolate}
.alternar{display:flex;gap:10px;align-items:center;margin-top:12px;padding:14px 16px;border-radius:18px;background:#fff;width:100%;text-align:left;box-shadow:0 4px 14px rgba(74,46,20,.06);color:var(--texto)}
.alternar .chave{width:46px;height:28px;border-radius:999px;background:var(--borda);position:relative;flex:none;transition:.25s}
.alternar .chave::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.3s var(--mola)}
.alternar[aria-pressed=true] .chave{background:var(--caramelo)}
.alternar[aria-pressed=true] .chave::after{left:21px}
.alternar b{display:block;font-size:15px}.alternar small{font-size:13px;color:var(--suave)}
.votacao{margin-top:4px;background:#fff;border-radius:22px;padding:16px;box-shadow:0 4px 14px rgba(74,46,20,.08);color:var(--texto)}
.votacao .op{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--borda);font-weight:700;font-size:14px}
.votacao .op:last-child{border:0}
.votacao .barrinha{flex:1;height:8px;border-radius:8px;background:var(--chip);overflow:hidden}
.votacao .barrinha i{display:block;height:100%;background:var(--dourado);border-radius:8px;animation:cresce 1s var(--suave-saida) both}
@keyframes cresce{from{width:0!important}}

/* ---------- 3. quem vai ---------- */
.roda{position:relative;height:286px;margin:0 0 14px}
.roda .centro{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;background:var(--couro-esc);color:var(--creme);display:grid;place-items:center;font:900 15px 'Fraunces',serif;box-shadow:0 0 0 8px rgba(185,122,34,.12),0 0 0 18px rgba(185,122,34,.06)}
.roda .orbita{position:absolute;left:50%;top:50%;width:220px;height:220px;margin:-110px 0 0 -110px;border-radius:50%;border:2px dashed var(--borda)}
.roda .amigo{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;transition:transform .6s var(--mola)}
.roda .amigo .rosto{width:56px;height:56px;font-size:18px;border-width:4px;animation:pop .5s var(--mola) both;box-shadow:0 6px 14px rgba(74,46,20,.2)}
.roda .amigo small{position:absolute;top:60px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:800;color:var(--texto);white-space:nowrap}
.roda .vazio-txt{position:absolute;inset:auto 0 6px;text-align:center;font-size:13px;color:var(--suave);font-weight:600}
.add{display:flex;gap:8px}
.add .busca{flex:1}
.add .mais{width:56px;height:56px;border-radius:18px;background:var(--couro-esc);color:var(--creme);display:grid;place-items:center;flex:none}

/* ---------- 4. montando ---------- */
.montando{background:var(--noite);color:#fff;align-items:center;justify-content:center;text-align:center}
.anel{width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--ouro) calc(var(--p)*1%),rgba(255,255,255,.08) 0);display:grid;place-items:center;position:relative}
.anel::before{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--noite)}
.anel b{position:relative;font:900 40px 'Fraunces',serif}
.lista-mont{margin-top:34px;display:grid;gap:14px;text-align:left;width:100%;max-width:290px}
.lista-mont div{display:flex;gap:12px;align-items:center;font-weight:700;font-size:15px;color:#bfa585;opacity:0;transform:translateY(8px);transition:.4s}
.lista-mont div.vis{opacity:1;transform:none}
.lista-mont div.ok{color:#fff}
.lista-mont i{width:24px;height:24px;border-radius:50%;border:2px solid #5b4330;display:grid;place-items:center;flex:none;transition:.3s}
.lista-mont div.ok i{background:var(--ouro);border-color:var(--ouro);color:var(--noite)}

/* ---------- 5. passaporte ---------- */
.revela{background:radial-gradient(500px 400px at 50% 30%,#4a2e14,var(--noite));color:#fff;align-items:center}
.livro{position:relative;width:270px;height:370px;margin-top:22px;perspective:1400px}
.miolo{position:absolute;inset:0;border-radius:8px 18px 18px 8px;background:linear-gradient(90deg,#e9d8bb,#f8eedc 12%);color:var(--texto);padding:22px 20px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.miolo::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 23px,rgba(123,84,47,.07) 23px 24px)}
.miolo>*{position:relative}
.miolo small{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--caramelo)}
.miolo .destino{font:900 38px/1 'Fraunces',serif;margin:6px 0 4px;color:var(--couro-esc)}
.miolo .datas{font-weight:700;font-size:14px;color:var(--suave)}
.miolo .falta{display:inline-flex;margin-top:10px;padding:6px 12px;border-radius:999px;background:var(--couro-esc);color:var(--creme);font-size:12px;font-weight:800}
.vaga-carimbo{position:absolute!important;right:18px;bottom:96px;width:110px;height:110px;border-radius:50%;border:2.5px dashed rgba(123,84,47,.35);display:grid;place-items:center;text-align:center;color:rgba(123,84,47,.5);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;line-height:1.2;transform:rotate(-8deg);animation:pulsa 2.2s ease-in-out infinite}
@keyframes pulsa{50%{transform:rotate(-8deg) scale(1.05);border-color:rgba(185,122,34,.7)}}
.miolo .galera{position:absolute!important;left:20px;right:20px;bottom:20px}
.miolo .galera p{font-size:12px;font-weight:700;color:var(--suave);margin-bottom:8px}
.miolo .rosto{border-color:#f5e9d6}
.capa{position:absolute;inset:0;border-radius:8px 18px 18px 8px;background:linear-gradient(135deg,#8a5e34,#5a3818 60%,#4a2e14);transform-origin:left center;transform-style:preserve-3d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#e9c98f;box-shadow:inset 0 0 0 2px rgba(233,201,143,.25),inset 10px 0 20px rgba(0,0,0,.25),0 30px 60px rgba(0,0,0,.5);animation:abre 1.3s cubic-bezier(.6,0,.2,1) 1s forwards;backface-visibility:hidden;z-index:2}
.capa .brasao{width:84px;height:84px;border-radius:50%;border:2px solid #e9c98f;display:grid;place-items:center}
.capa .t1{font-weight:800;font-size:12px;letter-spacing:.3em}
.capa .t2{font:900 24px 'Fraunces',serif;letter-spacing:.02em}
@keyframes abre{to{transform:rotateY(-165deg)}}
.confete{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;z-index:40;animation:confete linear forwards;pointer-events:none}
@keyframes confete{to{transform:translate(var(--dx),860px) rotate(var(--rot))}}

/* ---------- 6. convite (cartaz) ---------- */
.cartaz{position:relative;border-radius:28px;overflow:hidden;color:#fff;padding:22px;min-height:360px;display:flex;flex-direction:column;box-shadow:0 20px 40px rgba(74,46,20,.3);transition:background .5s}
.cartaz .fundo{position:absolute;inset:0;z-index:0;transition:opacity .4s}
.cartaz>*:not(.fundo){position:relative;z-index:1}
.cartaz .quem{font-weight:700;font-size:14px;opacity:.9}
.cartaz .titulo{font:900 54px/.92 'Fraunces',serif;letter-spacing:-.03em;margin:10px 0 8px;text-shadow:0 4px 24px rgba(0,0,0,.25)}
.cartaz .quando{font-weight:800;font-size:15px}
.cartaz .detalhes{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:18px}
.cartaz .rosto{border-color:rgba(255,255,255,.9);width:36px;height:36px;font-size:13px}
.cartaz .detalhes span{font-size:13px;font-weight:700}
.temas{display:flex;gap:8px;margin:14px -22px 4px;padding:0 22px 4px;overflow-x:auto;scrollbar-width:none}
.temas::-webkit-scrollbar{display:none}
.tema{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px 8px 8px;border-radius:999px;background:#fff;font-weight:700;font-size:14px;color:var(--texto);box-shadow:0 2px 8px rgba(74,46,20,.08);border:2px solid transparent}
.tema i{width:24px;height:24px;border-radius:50%}
.tema[aria-pressed=true]{border-color:var(--couro-esc)}
/* fundos animados dos temas */
.f-praia{background:linear-gradient(180deg,#ff9a5a 0%,#f0643e 45%,#c4433b 70%,#2a6f86 70.5%,#164b63 100%)}
.f-cidade{background:linear-gradient(180deg,#141a3a,#2b2363 60%,#552e6b)}
.f-serra{background:linear-gradient(180deg,#9fb8c6,#6f8fa0 55%,#3f5b54)}
.f-festa{background:linear-gradient(135deg,#ff4f7b,#7b2cbf 60%,#3a0ca3)}
.onda{position:absolute;left:-50%;width:200%;height:40px;bottom:0;animation:onda 6s linear infinite}
@keyframes onda{to{transform:translateX(25%)}}
.sol{position:absolute;left:50%;top:44%;width:120px;height:120px;margin-left:-60px;border-radius:50%;background:radial-gradient(#ffe29a,#ffc04d);box-shadow:0 0 60px #ffc04d;animation:sol 6s ease-in-out infinite}
@keyframes sol{50%{transform:translateY(8px)}}
.estrela{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:pisca 2.4s ease-in-out infinite}
@keyframes pisca{50%{opacity:.15}}
.raios{position:absolute;left:50%;top:30%;width:700px;height:700px;margin:-350px 0 0 -350px;background:repeating-conic-gradient(rgba(255,255,255,.12) 0 8deg,transparent 8deg 22deg);animation:gira 18s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.nevoa{position:absolute;left:-30%;width:160%;height:60px;border-radius:50%;background:rgba(255,255,255,.35);filter:blur(16px);animation:nevoa 9s ease-in-out infinite alternate}
@keyframes nevoa{to{transform:translateX(18%)}}

/* folha de baixo */
.folha-fundo{position:absolute;inset:0;background:rgba(20,10,4,.5);z-index:50;display:flex;align-items:flex-end;animation:fade .25s both;backdrop-filter:blur(2px)}
@keyframes fade{from{opacity:0}}
.folha{width:100%;background:var(--fundo);border-radius:30px 30px 0 0;padding:12px 22px 28px;color:var(--texto);animation:sobe .45s var(--suave-saida) both}
@keyframes sobe{from{transform:translateY(100%)}}
.folha .pega{width:40px;height:5px;border-radius:5px;background:var(--borda);margin:0 auto 16px}
.folha h3{font:900 25px/1.1 'Fraunces',serif;margin-bottom:6px}
.folha p{color:var(--suave);font-size:15px;line-height:1.45}
.google{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;border-radius:18px;background:#fff;border:1.5px solid var(--borda);font-weight:800;font-size:16px;color:var(--texto);margin-top:18px}
.aviso{position:absolute;left:10px;right:10px;top:10px;z-index:58;background:rgba(250,245,238,.92);backdrop-filter:blur(14px);color:var(--texto);border-radius:22px;padding:12px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:notif 4.2s var(--suave-saida) forwards}
@keyframes notif{0%{transform:translateY(-130%)}12%,82%{transform:none}100%{transform:translateY(-130%)}}
.aviso img{width:38px;height:38px;border-radius:10px;background:var(--couro-esc);object-fit:contain;padding:2px}
.aviso b{font-size:14px;display:block}.aviso span{font-size:13px;color:var(--suave)}

/* ---------- 7. casa da viagem ---------- */
.casa{padding:0;background:var(--fundo)}
.heroi{position:relative;height:300px;color:#fff;padding:60px 22px 20px;display:flex;flex-direction:column;overflow:hidden}
.heroi .fundo{position:absolute;inset:0}
.heroi>*:not(.fundo){position:relative}
.heroi small{font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.heroi .titulo{font:900 46px/.95 'Fraunces',serif;letter-spacing:-.03em;margin-top:4px}
.heroi .faltam{margin-top:auto;display:flex;align-items:baseline;gap:8px}
.heroi .faltam b{font:900 56px/1 'Fraunces',serif}
.heroi .faltam span{font-weight:700;font-size:15px;opacity:.9}
.corpo{scrollbar-width:none;flex:1;margin-top:-22px;background:var(--fundo);border-radius:26px 26px 0 0;padding:18px 18px 22px;position:relative;z-index:2;display:flex;flex-direction:column;gap:12px;color:var(--texto);overflow-y:auto}
.prox{background:var(--couro-esc);color:var(--creme);border-radius:24px;padding:16px}
.prox small{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--dourado)}
.prox .linha1{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.prox .linha1 b{font:900 20px 'Fraunces',serif;white-space:nowrap}
.prox .linha1 .rosto{width:34px;height:34px;font-size:12px}
.prox .rosto{border-color:var(--couro-esc);transition:filter .6s,opacity .6s}
.prox .barra-prog{margin-top:12px;background:rgba(255,255,255,.12)}
.prox .botao{margin-top:14px;height:50px;font-size:15px;background:var(--creme);color:var(--couro-esc);box-shadow:none}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:#fff;border-radius:20px;padding:14px;text-align:left;box-shadow:0 4px 14px rgba(74,46,20,.06);color:var(--texto)}
.tile .ic{width:36px;height:36px;border-radius:12px;background:var(--chip);color:var(--couro);display:grid;place-items:center;margin-bottom:10px}
.tile b{display:block;font-size:15px}.tile small{font-size:13px;color:var(--suave)}
.tile.largo{grid-column:span 2;display:flex;align-items:center;gap:12px}
.tile.largo .ic{margin:0}
.depois{font-size:13px;color:var(--suave);text-align:center;line-height:1.4;padding:4px 10px}
.demo{background:#fff;border-radius:18px;padding:14px;margin:16px 0;display:grid;gap:10px}
.demo .g{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600;opacity:0;animation:cai .45s var(--suave-saida) forwards}
.demo .g:nth-child(2){animation-delay:.5s}.demo .g:nth-child(3){animation-delay:1s}
.demo .total{border-top:1.5px dashed var(--borda);padding-top:10px;font:900 22px 'Fraunces',serif;color:var(--verde);opacity:0;animation:pop .5s var(--mola) 1.6s forwards}

/* ---------- convidado ---------- */
.convite{padding:0;color:#fff}
.convite .fundo{position:absolute;inset:0}
.convite .rolar{scrollbar-width:none;position:absolute;inset:0;overflow-y:auto;padding:64px 22px 150px}
.convite .quem{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.convite .titulo{font:900 72px/.9 'Fraunces',serif;letter-spacing:-.04em;margin:18px 0 10px;text-shadow:0 4px 30px rgba(0,0,0,.2)}
.convite .quando{font-weight:800;font-size:17px}
.vidro-card{margin-top:16px;background:rgba(40,18,6,.28);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.22);border-radius:22px;padding:14px 16px}
.vidro-card .l{display:flex;gap:12px;align-items:center;padding:8px 0}
.vidro-card .l+.l{border-top:1px solid rgba(255,255,255,.15)}
.vidro-card .l b{display:block;font-size:15px}.vidro-card .l span{font-size:13px;opacity:.85}
.vidro-card .ic{width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.quem-vai .rosto{width:40px;height:40px;border-color:rgba(255,255,255,.95)}
.rsvp{position:absolute;left:0;right:0;bottom:0;padding:16px 18px 26px;background:linear-gradient(transparent,rgba(20,10,4,.55) 35%);z-index:5}
.rsvp .linha-op{display:flex;gap:8px;margin-top:8px}
.rsvp .linha-op button{flex:1;height:44px;border-radius:14px;background:rgba(255,255,255,.16);backdrop-filter:blur(10px);font-weight:700;font-size:14px;color:#fff}
.rosto.entrou{z-index:3;animation:entrou 1.1s var(--mola) .5s both}
@keyframes entrou{0%{transform:translateY(320px) scale(1.8);opacity:0}30%{opacity:1}100%{transform:none}}
</style>
</head>

  if (t==='cidade') return `<div class="fundo f-cidade">${Array.from({length:40},(_,k)=>`<i class="estrela" style="left:${(k*37)%100}%;top:${(k*53)%70}%;animation-delay:${(k%7)*.35}s"></i>`).join('')}<svg style="position:absolute;bottom:0;width:100%;height:45%" viewBox="0 0 200 130" preserveAspectRatio="none">${cenaSvg('cidade',['transparent','transparent'],'c'+Math.random()).replace(/<rect width="200" height="130"[^>]*>/,'')}</svg></div>`
  if (t==='serra') return `<div class="fundo f-serra"><svg style="position:absolute;bottom:0;width:100%;height:60%" viewBox="0 0 200 130" preserveAspectRatio="none"><path d="M0 130 V70 L40 30 L80 72 L120 24 L160 66 L200 40 V130Z" fill="#2f4740" opacity=".6"/><path d="M0 130 V96 L34 78 L70 96 L110 70 L150 94 L200 80 V130Z" fill="#22352f"/></svg><div class="nevoa" style="bottom:30%"></div><div class="nevoa" style="bottom:12%;animation-duration:12s"></div></div>`
  return `<div class="fundo f-festa"><div class="raios"></div></div>`
}

// ---------- estado ----------
const NOVO = () => ({ lugar:null, outro:'', combinar:false, ini:11, fim:14, nomes:[], digitando:'', tema:null, conta:false, folha:null, topou:0, conv:{ fase:'convite', nome:'' } })
let d = NOVO()
let trilho = 'org', i = 0, timers = []
const espera = (fn, ms) => timers.push(setTimeout(fn, ms))
const limpa = () => { timers.forEach(clearTimeout); timers = [] }

const lugarNome = () => d.lugar ? d.lugar.nome : (d.outro || 'algum lugar')
const lugarObj = () => d.lugar || { nome:d.outro||'A viagem', uf:'', cena:'praia', tema:'praia', g:['#e3a04a','#7b542f'] }
const tema = () => d.tema || lugarObj().tema
const dataDe = n => new Date(2026,11,n)
const noites = () => d.fim ? d.fim - d.ini : 0
const textoData = () => d.combinar ? 'Data a combinar' : `${SEM[dataDe(d.ini).getDay()]} ${d.ini} a ${SEM[dataDe(d.fim||d.ini).getDay()]} ${d.fim||d.ini} de dez`
const faltam = () => Math.round((dataDe(d.ini) - HOJE) / 864e5)
const iniciais = n => n.trim().split(/\s+/).map(p=>p[0]).slice(0,2).join('').toUpperCase()
const rosto = (n,k,cls='') => `<span class="rosto ${cls}" style="background:${CORES[k%CORES.length]}">${iniciais(n)}</span>`
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))
const amigos = () => d.nomes.length ? d.nomes : ['Bia','Lu','Rafa','Dani']
const fala = (img, txt, sub='') => `<div class="fala"><img src="${IMG[img]}" alt=""><div class="balao">${txt}${sub?`<small>${sub}</small>`:''}</div></div>`
const cabeca = n => `<div class="cabeca"><button class="voltar" data-ir="-1" aria-label="Voltar">${I.voltar}</button><div class="barra-prog"><i style="width:${n}%"></i></div></div>`
function confete(qtd=70){
  const v = document.getElementById('vidro')
  for (let k=0;k<qtd;k++){
    const c = document.createElement('i'); c.className='confete'
    c.style.left = Math.random()*100+'%'; c.style.background = CONFETE[k%CONFETE.length]
    c.style.setProperty('--dx',(Math.random()*160-80)+'px'); c.style.setProperty('--rot',(Math.random()*900)+'deg')
    c.style.animationDuration = (1.8+Math.random()*1.6)+'s'; c.style.animationDelay = (Math.random()*.5)+'s'
    v.appendChild(c); setTimeout(()=>c.remove(),4200)
  }
}

// ================= QUEM ORGANIZA =================
const ORG = [
{ nome:'Abertura', escuro:true,
  titulo:'Abertura em stories: mostrar, não explicar',
  porque:`<p>A galera chega do TikTok e do Reels. Então a primeira tela fala a mesma língua: <b>stories que passam sozinhos</b>, tocando pra pular.</p><p>Cada story é <b>um momento real do produto acontecendo</b>, não uma frase sobre ele:</p><p>1. O grupo do WhatsApp bagunçado ("embarque é sábado??") vira um cartão só, que todo mundo viu.<br>2. Os recibos voam e viram "a Bia te deve R$ 90".<br>3. Os carimbos caem no passaporte da galera.</p><p>A conta não aparece aqui. Só dois botões: organizar ou "recebi um convite".</p>`,
  ref:`Satya e Jay Dwivedi (mostrar valor antes de pedir esforço), Airbnb travel map (1 ideia por tela, ilustração animada), post da rodoviária no X (8 mil curtidas), Splitwise "calcula quem deve quem".`,
  tela:()=>`
  <div class="tela stories" style="--dur:5.4s">
    <div class="barras">${[0,1,2].map(k=>`<i id="b${k}"><b></b></i>`).join('')}</div>
    <div id="cena"></div>
    <div class="toques"><button id="st-ant" aria-label="Story anterior"></button><button id="st-prox" aria-label="Próximo story"></button></div>
    <div class="rodape-stories">
      <div class="marca"><img src="${IMG.wave}" alt="">Norti</div>
      <button class="botao claro" data-ir="+1">Organizar uma viagem</button>
      <button class="link" data-trilho="conv">Recebi um convite</button>
    </div>
  </div>`,
  depois(){
    const cenas = [
      ()=>`<div class="cena"><h2>O grupo da viagem, <em>sem bagunça.</em></h2><p class="sub">Todo mundo vê a mesma data, a mesma hora e o mesmo lugar.</p>
        <div class="chat" id="chat">${[['Lu','gente o embarque é que horas?'],['Rafa','achei q era sábado'],['Bia','QUEM LEVA A CAIXA DE SOM'],['eu','é sexta 7h40 gente, já falei 3x'],['Dani','pera, qual rodoviária?']].map(([q,t],k)=>`<div class="msg ${q==='eu'?'eu':''}" style="animation-delay:${.3+k*.45}s">${q==='eu'?'':`<b style="color:${CORES[k%CORES.length]}">${q}</b>`}${t}</div>`).join('')}</div>
        <div class="cartao-certo" style="animation-delay:2.9s"><small>Saída</small><div class="grande">Sexta, 7h40</div><div style="font-weight:700;color:var(--suave)">Rodoviária de Salvador</div><div class="viram">${I.ok} 5 de 5 viram</div></div></div>`,
      ()=>`<div class="cena"><h2>Quem deve quanto, <em>sem planilha.</em></h2><p class="sub">Cada um lança o que pagou. A conta fecha sozinha, em real.</p>
        <div class="recibos">${[['Mercado','R$ 240',-10,0,-8],['Uber','R$ 60',150,40,7],['Casa','R$ 1.800',20,110,-4],['Cerveja','R$ 96',160,150,9]].map(([a,b,x,y,r],k)=>`<div class="recibo" style="--x:${x}px;--y:${y}px;--r:${r}deg;left:16px;top:0;animation-delay:${.2+k*.3}s"><span>${a}</span>${b}</div>`).join('')}</div>
        <div class="saldo"><small>Acerto da viagem</small><div class="grande">Bia te deve R$ 90</div><div class="linha">Lu e Rafa já estão quites</div></div></div>`,
      ()=>`<div class="cena"><h2>Cada viagem vira <em>carimbo da galera.</em></h2><p class="sub">O passaporte de vocês, com cada lugar que a galera já foi junto.</p>
        <div class="pagina-pass" id="pag">
          <div class="carimbo" style="--r:-12deg;left:16px;top:20px;color:#a1442b;animation-delay:.5s">Bahia<span>Salvador</span>2025</div>
          <div class="carimbo quadrado" style="--r:9deg;left:150px;top:46px;color:#2a6f86;animation-delay:1.1s">Santa Catarina<span>Floripa</span>2024</div>
          <div class="carimbo" style="--r:-4deg;left:60px;top:160px;color:#5e6b2e;animation-delay:1.7s">Minas<span>Ouro Preto</span>2026</div>
        </div></div>`
    ]
    let k = 0
    const mostra = n => {
      k = (n+3)%3
      timers.forEach(clearTimeout); timers = []
      document.getElementById('cena').innerHTML = cenas[k]()
      ;[0,1,2].forEach(j=>{ const b=document.getElementById('b'+j); b.className = j<k?'feito':j===k?'agora':''; const f=b.firstChild; f.style.animation='none'; f.offsetWidth; f.style.animation='' })
      if (k===0) espera(()=>document.getElementById('chat')?.classList.add('some'), 2700)
      if (k===2) [.5,1.1,1.7].forEach(s=>espera(()=>{const p=document.getElementById('pag'); p?.classList.remove('treme'); p&&void p.offsetWidth; p?.classList.add('treme')}, s*1000+300))
      espera(()=>mostra(k+1), 5400)
    }
    document.getElementById('st-prox').onclick = () => mostra(k+1)
    document.getElementById('st-ant').onclick = () => mostra(k-1)
    mostra(0)
  } },

{ nome:'Pra onde',
  titulo:'Pergunta 1: pra onde (a Norti pergunta)',
  porque:`<p>A Norti vira <b>anfitriã</b>: ela pergunta em balão e <b>reage à resposta</b> ("Salvador! Já tô sentindo o cheiro de acarajé."). É o que deixa o Duolingo leve.</p><p>Em vez de um campo de texto vazio, <b>cartões-postal</b> pra tocar. Escolher é mais gostoso do que digitar, e o lugar já vira a cara da viagem nas telas seguintes.</p><p>O botão só sobe depois que a pessoa escolhe.</p>`,
  ref:`Duolingo (mascote faz a pergunta e reage), AI Companion do Satya (cartões grandes pra escolher), Jay Dwivedi (só perguntas que mudam a experiência), Mochi (entrevista em vez de menu).`,
  tela:()=>`
  <div class="tela">
    ${cabeca(25)}
    <div id="fala1">${fala(d.lugar?'love':'think', d.lugar?d.lugar.fala:'Bora! Pra onde a galera vai?', d.lugar?'':'Escolhe um ou digita o lugar.')}</div>
    <label class="busca cai d1">${I.busca}<input id="outro" placeholder="Digita uma cidade ou praia" value="${esc(d.outro)}" autocomplete="off"></label>
    <div class="cartoes-lugar">${LUGARES.map((l,k)=>`<button class="lugar pop d${k+1}" data-lugar="${k}" aria-pressed="${d.lugar===l}">${cenaSvg(l.cena,l.g,k)}<span class="ok">${I.ok}</span><b>${l.nome}</b><small>${l.uf}</small></button>`).join('')}</div>
    <div class="espaco"></div>
    <div class="rodape ${d.lugar||d.outro?'':'escondido'}" id="rod1"><button class="botao" data-ir="+1">Continuar</button></div>
  </div>` },

{ nome:'Quando',
  titulo:'Pergunta 2: quando (o número grande)',
  porque:`<p>A data é o que mais dá briga no grupo. Então ela ganha <b>um número enorme</b> que muda na hora em que a pessoa toca no calendário: "3 noites".</p><p>Calendário de tocar ida e volta, já aberto no mês certo.</p><p>"Ainda vamos combinar" mostra na hora <b>como vai ser</b>: a galera vota nas datas. A pessoa vê o resultado antes de ter o trabalho.</p>`,
  ref:`AI Companion do Satya (contador gigante que reage), Jay Dwivedi (movimento com propósito), dor do X ("achei q era sábado").`,
  tela:()=>{
    const pri = new Date(2026,11,1).getDay()
    const cel = Array.from({length:pri},()=>'<span></span>').join('') + Array.from({length:31},(_,k)=>{
      const n=k+1, cls=[]
      if (n===d.ini||n===d.fim) cls.push('ponta')
      if (d.fim && n>d.ini && n<d.fim) cls.push('meio')
      if (d.fim && n===d.ini && d.fim!==d.ini) cls.push('ini')
      if (d.fim && n===d.fim && d.fim!==d.ini) cls.push('fim')
      return `<button data-dia="${n}" class="${cls.join(' ')}">${n}</button>`
    }).join('')
    return `
  <div class="tela">
    ${cabeca(50)}
    ${fala('point', d.combinar?'Fechou, a galera decide junto.':`Quando vai ser ${d.lugar?'em '+esc(lugarNome()):'a viagem'}?`, d.combinar?'Cada um marca o que pode.':'Toca na ida e depois na volta.')}
    ${d.combinar ? `
      <div class="votacao cai"><div style="font-weight:800;margin-bottom:6px">Assim a galera vai ver:</div>
        ${[['11 a 14 dez',80,'4'],['18 a 21 dez',40,'2'],['8 a 11 jan',20,'1']].map(([t,w,v])=>`<div class="op"><span style="width:92px">${t}</span><span class="barrinha"><i style="width:${w}%"></i></span><span>${v}</span></div>`).join('')}</div>`
    : `
      <div class="contador"><span class="num mudou" id="num">${noites()}</span><span>${noites()===1?'noite':'noites'}</span></div>
      <div class="cal cai d1"><div class="mes"><span>dezembro de 2026</span><span style="color:var(--suave);font-size:13px">${d.fim?textoData():'escolhe a volta'}</span></div>
        <div class="sem">${['D','S','T','Q','Q','S','S'].map(s=>`<span>${s}</span>`).join('')}</div><div class="dias">${cel}</div></div>`}
    <button class="alternar" data-alternar aria-pressed="${d.combinar}"><span class="chave"></span><span><b>Ainda vamos combinar</b><small>A galera vota na data que serve</small></span></button>
    <div class="espaco"></div>
    <div class="rodape ${d.combinar||d.fim?'':'escondido'}"><button class="botao" data-ir="+1">Continuar</button></div>
  </div>` } },

{ nome:'Quem vai',
  titulo:'Pergunta 3: quem vai (a roda da galera)',
  porque:`<p>Cada nome digitado <b>pula pra roda</b> em volta de "Você". A pessoa vê a galera se formando, não uma lista.</p><p>Só o nome, como ela chama a amiga. Nada de contato ou telefone: o convite vai pelo grupo depois.</p><p>É a tela onde a pessoa mais vai demorar, e tudo bem: no app de bebê do Gabriel Buzzi, as telas de nome são as que mais seguram, porque é a hora da empolgação.</p>`,
  ref:`Gabriel Buzzi / enxovaly (telas de nome seguram), Partiful (o rosto de quem vai é o gancho), Airbnb travel map (rostos dos amigos em volta).`,
  tela:()=>{
    const ns = d.nomes, n = ns.length
    return `
  <div class="tela">
    ${cabeca(75)}
    ${fala(n?'celebrate':'wave', n?`${n+1} na viagem! ${n<3?'Quem mais?':'Que galera.'}`:'E quem vai com você?', 'Só o nome, do jeito que você chama.')}
    <div class="roda">
      <div class="orbita"></div>
      <div class="centro">Você</div>
      ${ns.map((nm,k)=>{ const a = -Math.PI/2 + k*2*Math.PI/Math.max(n,1); return `<div class="amigo ${k===n-1?'novo':''}" style="transform:translate(${Math.cos(a)*110}px,${Math.sin(a)*110}px)">${rosto(nm,k)}<small>${esc(nm)}</small></div>` }).join('')}
      ${n?'':'<div class="vazio-txt">A galera aparece aqui</div>'}
    </div>
    <div class="add"><label class="busca">${I.pessoas}<input id="nome" placeholder="Nome" value="${esc(d.digitando)}" autocomplete="off" maxlength="16"></label><button class="mais" id="add" aria-label="Adicionar">${I.mais}</button></div>
    <div class="espaco"></div>
    <div class="rodape ${n?'':'escondido'}"><button class="botao" data-ir="+1">Montar a viagem</button></div>
    ${n?'':'<button class="link" data-exemplo>Usar nomes de exemplo</button>'}
  </div>` } },

{ nome:'Montando', escuro:true,
  titulo:'Montando a viagem (a espera que dá valor)',
  porque:`<p>Três segundos em que a Norti <b>conta o que está fazendo com as respostas dela</b>: "criando o grupo da viagem pra 5", "preparando o passaporte de Salvador".</p><p>Não é enrolação: é a pessoa vendo que o que ela respondeu virou alguma coisa. Passa sozinho.</p>`,
  ref:`Cal AI / Jake Castillo ("montando seu plano" antes da revelação), Jay Dwivedi (personalizar com as respostas).`,
  tela:()=>`
  <div class="tela montando">
    <div class="anel" id="anel" style="--p:0"><b id="pct">0%</b></div>
    <div class="lista-mont">${[`Criando o grupo da viagem pra ${amigos().length+1}`,`Preparando o passaporte ${d.lugar?'de '+esc(lugarNome()):'da viagem'}`, d.combinar?'Abrindo a votação das datas':`Marcando ${textoData()}`,'Separando as contas da galera'].map((t,k)=>`<div id="m${k}"><i></i>${t}</div>`).join('')}</div>
  </div>`,
  depois(){
    const t0 = Date.now() + 300
    const passo = () => { const p = Math.max(0, Math.min(100, Math.round((Date.now()-t0)/30))); const a=document.getElementById('anel'); if(!a) return; a.style.setProperty('--p',p); document.getElementById('pct').textContent=p+'%'
      const k = Math.floor(p/25); for (let j=0;j<4;j++){ const m=document.getElementById('m'+j); if(j<=k) m.classList.add('vis'); if(j<k||p===100) { m.classList.add('ok'); m.querySelector('i').innerHTML=I.ok } }
      if (p<100) espera(passo, 55); else espera(()=>ir('+1'), 650) }
    espera(passo, 300)
  } },

{ nome:'Passaporte', escuro:true,
  titulo:'A revelação: o passaporte abre',

      </div>

  depois(){ espera(()=>confete(), 1900); espera(()=>document.getElementById('rod5')?.classList.remove('escondido'), 2300) } },

{ nome:'A viagem', claroNoTopo:true,
  titulo:'A casa da viagem: um próximo passo e a galera chegando',
  porque:`<p>Em cima, <b>a cara da viagem</b> e o número que importa: "faltam 32 dias".</p><p>Logo abaixo, <b>um próximo passo só</b>, com os rostos. Espera dois segundos: <b>a Bia topa</b>. Chega o aviso, o rosto dela acende e a barra anda. <b>Esse é o momento de ativação</b>: a galera aparecendo.</p><p>Só 3 atalhos (data, saída e contas). Transporte, hospedagem e roteiro chegam quando for a hora deles. Toca em <b>Contas</b>: na primeira vez sobe uma mini demo, em vez de um tour no começo.</p>`,
  ref:`Richard ("produto que direciona entrega ativação"; Swiss Knife Index), 60fps (folha com mini demo na hora de usar), Partiful (quem vai em primeiro plano).`,
  tela:()=>{
    const gs = amigos(), tot = gs.length + 1, top = 1 + d.topou
    return `
  <div class="tela casa">
    <div class="heroi">${fundoTema(tema())}
      <small>${textoData()}</small>
      <div class="titulo">${esc(lugarNome())}</div>
      ${d.combinar?'<div class="faltam"><b style="font-size:30px">Votação aberta</b></div>':`<div class="faltam"><b>${faltam()}</b><span>dias pra viagem</span></div>`}
    </div>
    <div class="corpo">
      <div class="prox cai">
        <small>Próximo passo</small>
        <div class="linha1"><b id="topou">${top} de ${tot} toparam</b><div class="fila-rostos">${rosto('Você',0)}${gs.slice(0,4).map((n,k)=>rosto(n,k+1, k<d.topou?'':'apagado')).join('')}</div></div>
        <div class="barra-prog"><i style="width:${top/tot*100}%"></i></div>
        <button class="botao" data-ir="6">Chamar quem falta</button>
      </div>
      <div class="tiles">
        <button class="tile cai d2"><span class="ic">${I.cal}</span><b>${d.combinar?'Votação':'Datas'}</b><small>${d.combinar?'2 votaram':textoData().replace(' de dez','')}</small></button>
        <button class="tile cai d3"><span class="ic">${I.onibus}</span><b>Saída</b><small>Definir hora e lugar</small></button>
        <button class="tile largo cai d4" data-folha="contas"><span class="ic">${I.conta}</span><span><b>Contas</b><small>Ninguém deve nada ainda</small></span></button>
      </div>
      <p class="depois cai d5">Transporte, hospedagem e roteiro aparecem aqui quando for a hora deles.</p>
    </div>
    ${d.folha==='contas'?`<div class="folha-fundo" data-fecha><div class="folha" data-fica>
      <div class="pega"></div><h3>Contas sem planilha</h3><p>Cada um lança o que pagou. A Norti diz quem deve quem. Em real, de graça.</p>
      <div class="demo"><div class="g"><span>Você pagou o mercado</span><b>R$ 240</b></div><div class="g"><span>${esc(gs[0])} pagou o Uber</span><b>R$ 60</b></div><div class="total">${esc(gs[0])} te deve R$ 90</div></div>
      <button class="botao" data-fecha>Lançar o primeiro gasto</button><button class="link" data-fecha>Agora não</button></div></div>`:''}
  </div>` },
  depois(){
    if (d.topou) return
    espera(()=>{
      const gs = amigos(); d.topou = 1
      const v = document.getElementById('vidro')
      const a = document.createElement('div'); a.className='aviso'
      a.innerHTML = `<img src="${IMG.celebrate}" alt=""><div><b>${esc(gs[0])} topou ${esc(lugarNome())}!</b><span>Agora são 2 de ${gs.length+1} na viagem.</span></div>`
      v.appendChild(a); setTimeout(()=>a.remove(), 4300)
      espera(()=>{ if (!d.folha) desenhar(false) ; confete(30) }, 700)
    }, 2200)
  } },
]

// ---------- desenhar e navegar ----------
const passos = () => trilho==='org' ? ORG : CONV
function desenhar(anima='entra'){
  limpa()
  document.querySelectorAll('.entrou-rosto').forEach(e=>e.remove())
  const p = passos()[i]
  const area = document.getElementById('area')
  area.innerHTML = p.tela()
  const t = area.firstElementChild; t.classList.add(anima || 'parado')
  document.getElementById('vidro').classList.toggle('escuro', !!(p.escuro || p.claroNoTopo))
  document.getElementById('sinal').textContent = trilho==='org' ? 'app' : 'navegador'
  document.getElementById('n-etapa').textContent = `${trilho==='org'?'Quem organiza':'Quem foi convidado'} · ${i+1} de ${passos().length}`
  document.getElementById('n-titulo').textContent = p.titulo
  document.getElementById('n-porque').innerHTML = p.porque
  document.getElementById('n-ref').innerHTML = `<strong>De onde veio</strong>${p.ref}`
  document.getElementById('passos').innerHTML = passos().map((x,k)=>`<button data-pular="${k}" aria-current="${k===i}">${k+1}. ${x.nome}</button>`).join('')
  document.getElementById('t-org').setAttribute('aria-pressed', trilho==='org')
  document.getElementById('t-conv').setAttribute('aria-pressed', trilho==='conv')
  p.depois && p.depois()
}
function ir(v){
  const max = passos().length-1, antes = i
  i = v==='+1' ? Math.min(i+1,max) : v==='-1' ? Math.max(i-1,0) : +v
  d.folha = null
  document.querySelectorAll('.aviso').forEach(e=>e.remove())
  desenhar(i<antes ? 'volta' : 'entra')
}
function trocaTrilho(t){ trilho=t; i=0; d.folha=null; desenhar() }

document.addEventListener('click', e=>{
  const b = e.target.closest('button,[data-fecha]'); if (!b) return
  if (b.id==='t-org') return trocaTrilho('org')
  if (b.id==='t-conv') return trocaTrilho('conv')
  if (b.id==='reiniciar') { d = NOVO(); return trocaTrilho(trilho) }
  if (b.dataset.trilho) return trocaTrilho(b.dataset.trilho)
  if (b.dataset.pular!==undefined) return ir(b.dataset.pular)
  if (b.dataset.lugar!==undefined){
    d.lugar = LUGARES[+b.dataset.lugar]; d.outro=''; d.tema=null
    document.querySelectorAll('[data-lugar]').forEach(x=>x.setAttribute('aria-pressed', x===b))
    document.getElementById('outro').value=''
    document.getElementById('fala1').innerHTML = fala('love', d.lugar.fala)
    document.getElementById('rod1').classList.remove('escondido'); return
  }
  if (b.dataset.dia){ const n=+b.dataset.dia
    if (!d.fim || n<=d.ini) { d.ini=n; d.fim=null } else d.fim=n
    return desenhar(false) }
  if (b.dataset.alternar!==undefined){ d.combinar=!d.combinar; return desenhar(false) }
  if (b.id==='add') return adiciona()
  if (b.dataset.exemplo!==undefined){ d.nomes=['Bia','Lu','Rafa','Dani']; return desenhar(false) }
  if (b.dataset.tema){ d.tema=b.dataset.tema; return desenhar(false) }
  if (b.dataset.folha){ d.folha=b.dataset.folha; return desenhar(false) }
  if (b.dataset.enviar!==undefined){ d.folha=null; return ir('+1') }
  if (b.dataset.fecha!==undefined){ if (e.target.closest('[data-fica]') && b.hasAttribute('data-fica')) return; if (b.classList.contains('folha-fundo') && e.target.closest('.folha')) return; d.folha=null; return desenhar(false) }
  if (b.dataset.ir) return ir(b.dataset.ir)
})
function adiciona(){
  const n = d.digitando.trim(); if (!n || d.nomes.length>=7) return
  d.nomes.push(n[0].toUpperCase()+n.slice(1)); d.digitando=''
  desenhar(false); document.getElementById('nome')?.focus()
}
document.addEventListener('input', e=>{
  const t = e.target
  if (t.id==='outro'){ d.outro=t.value.trim(); if (d.outro){ d.lugar=null; d.tema=null; document.querySelectorAll('[data-lugar]').forEach(x=>x.setAttribute('aria-pressed',false)) }
    document.getElementById('rod1').classList.toggle('escondido', !(d.lugar||d.outro))
    document.getElementById('fala1').innerHTML = fala(d.outro?'love':'think', d.outro?`${esc(d.outro)}! Boa escolha.`:'Bora! Pra onde a galera vai?', d.outro?'':'Escolhe um ou digita o lugar.') }
  if (t.id==='nome') d.digitando=t.value
  if (t.id==='convnome'){ d.conv.nome=t.value.trim(); document.getElementById('rodc').classList.toggle('escondido', !d.conv.nome) }
})
document.addEventListener('keydown', e=>{
  if (e.key!=='Enter') return
  if (e.target.id==='nome') adiciona()
  if (e.target.id==='outro' && d.outro) ir('+1')
  if (e.target.id==='convnome' && d.conv.nome) ir('+1')
})
desenhar()
</script>

</html>
