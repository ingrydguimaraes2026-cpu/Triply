<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Referências App Store Tracker</title>
<style>body{margin:0;padding:24px 16px;background:#f4ede3;font:14px/1.4 system-ui,sans-serif;color:#2b1d14}h1{font-size:26px;margin:0 0 4px}p{margin:0 0 20px;color:#6b5646}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}figure{margin:0;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 10px #0001}
img{width:100%;display:block;cursor:zoom-in}figcaption{padding:10px 12px;display:flex;flex-direction:column;gap:4px}.p{color:#c2581c;font-weight:600;font-size:12px}
#z{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center}#z img{max-height:94vh;width:auto;max-width:94vw;border-radius:12px}</style>
<h1>Referências do App Store Tracker</h1><p>28 telas reais. Clique numa tela pra ampliar.</p><div class="g"><figure><img src="01-duolingo-mascote.jpg" loading="lazy"><figcaption><b>Duolingo</b><span class="p">Abertura com a Norti</span><span>Mascote no centro, um balão curto ("só 7 perguntas"), um botão. Nada mais na tela.</span></figcaption></figure>
<figure><img src="02-clarymind-mascote-escuro.jpg" loading="lazy"><figcaption><b>Clarymind</b><span class="p">Abertura (momento escuro)</span><span>Mascote grande em fundo escuro, apresentação em 2 linhas, botão "Hi" como resposta.</span></figcaption></figure>
<figure><img src="05-her75-cartao-convite.jpg" loading="lazy"><figcaption><b>Her 75</b><span class="p">Convidar a galera</span><span>Convite como cartão de papel com código, e o porquê ("+30% de sucesso com amigos").</span></figcaption></figure>
<figure><img src="06-partiful-evento-lista.jpg" loading="lazy"><figcaption><b>Partiful</b><span class="p">Galera / convite web</span><span>Lista de convidados com rostos e 3 botões grandes (vou, talvez, não vou).</span></figcaption></figure>
<figure><img src="07-partiful-evento-detalhe.jpg" loading="lazy"><figcaption><b>Partiful</b><span class="p">Cartaz do convite</span><span>Título com fonte de personalidade, arte grande, data, barra de ações embaixo.</span></figcaption></figure>
<figure><img src="08-partiful-rsvp.jpg" loading="lazy"><figcaption><b>Partiful</b><span class="p">"Topar" no `/v/<código>`</span><span>Folha (sheet) de resposta: 3 bolhas grandes, comentário opcional.</span></figcaption></figure>
<figure><img src="09-howbout-foi-convidado.jpg" loading="lazy"><figcaption><b>Howbout</b><span class="p">Dois caminhos: organiza ou foi convidado</span><span>Foto de gente de verdade em tela cheia + "Você foi convidado?" logo no começo.</span></figcaption></figure>
<figure><img src="10-scene-cartao-convite.jpg" loading="lazy"><figcaption><b>Scene</b><span class="p">Montar o convite</span><span>Prévia do convite num celular, capa escolhida por miniaturas.</span></figcaption></figure>
<figure><img src="11-stippl-novo-gasto.jpg" loading="lazy"><figcaption><b>Stippl</b><span class="p">Contas: lançar gasto</span><span>Valor gigante no topo, linhas curtas (pago, dividir com, data).</span></figcaption></figure>
<figure><img src="12-tripsy-gastos-e-galera.jpg" loading="lazy"><figcaption><b>Tripsy</b><span class="p">Viagem: blocos</span><span>Cartões empilhados na viagem: gastos, últimos itens, convidar.</span></figcaption></figure>
<figure><img src="13-rhyme-mapa-roteiro.jpg" loading="lazy"><figcaption><b>Rhyme</b><span class="p">Roteiro</span><span>Mapa no alto com dias coloridos, folha embaixo com os dias e fotos.</span></figcaption></figure>
<figure><img src="14-stippl-plano-do-dia.jpg" loading="lazy"><figcaption><b>Stippl</b><span class="p">Roteiro + Reservas</span><span>Abas Rota / Dias / Reservas e dias em lista com clima.</span></figcaption></figure>
<figure><img src="15-wanderlog-dia-a-dia.jpg" loading="lazy"><figcaption><b>Wanderlog</b><span class="p">Roteiro, "próximo passo"</span><span>Data enorme ("Tue 11/3") como título do dia, aviso de hospedagem faltando no pé.</span></figcaption></figure>
<figure><img src="16-tripsy-viagem.jpg" loading="lazy"><figcaption><b>Tripsy</b><span class="p">Capa da viagem</span><span>Foto da cidade em tela cheia, nome grande, "começa em 16 dias".</span></figcaption></figure>
<figure><img src="17-once-home-evento.jpg" loading="lazy"><figcaption><b>Once</b><span class="p">Fotos</span><span>Evento ativo como cartão-foto grande, álbuns embaixo, tudo escuro.</span></figcaption></figure>
<figure><img src="19-housewarming-feed-vazio.jpg" loading="lazy"><figcaption><b>Housewarming</b><span class="p">Fotos vazio</span><span>Estado vazio com fotos em leque e uma frase.</span></figcaption></figure>
<figure><img src="20-luggo-proxima-viagem.jpg" loading="lazy"><figcaption><b>Luggo</b><span class="p">Minhas viagens</span><span>Cartão escuro "próxima partida" com progresso e "7 dias", lista abaixo.</span></figcaption></figure>
<figure><img src="21-tripsy-lista-viagens.jpg" loading="lazy"><figcaption><b>Tripsy</b><span class="p">Minhas viagens</span><span>Viagem como foto grande com nome e "começa em 16 dias".</span></figcaption></figure>
<figure><img src="22-loverzz-contagem.jpg" loading="lazy"><figcaption><b>Loverzz</b><span class="p">Contagem regressiva</span><span>Número gigante + "days to go" manuscrito em cartão marrom. Cor muito perto da nossa.</span></figcaption></figure>
<figure><img src="23-antigone-passaporte.jpg" loading="lazy"><figcaption><b>Antigone</b><span class="p">Passaporte da galera (âncora)</span><span>Passaporte bege com carimbo, contador "1/112", diário de visitas.</span></figcaption></figure>
<figure><img src="25-walka-colecao.jpg" loading="lazy"><figcaption><b>Walka</b><span class="p">Carimbos / selos</span><span>Coleção "0/100" com moedas bloqueadas por categoria.</span></figcaption></figure>
<figure><img src="26-been-paises.jpg" loading="lazy"><figcaption><b>been</b><span class="p">Passaporte</span><span>Mapa pintado + contador "3/195 países".</span></figcaption></figure>
<figure><img src="27-wanderlog-convidar.jpg" loading="lazy"><figcaption><b>Wanderlog</b><span class="p">Convidar</span><span>Título grande, cartão com 1 frase de porquê e botão, "talvez depois".</span></figcaption></figure>
<figure><img src="28-rhyme-convidar.jpg" loading="lazy"><figcaption><b>Rhyme</b><span class="p">Convidar (mostra o que a galera recebe)</span><span>Prévia da mensagem no WhatsApp/iMessage antes de enviar.</span></figcaption></figure>
<figure><img src="29-airbnb-viagens-vazio.jpg" loading="lazy"><figcaption><b>Airbnb</b><span class="p">Estados vazios</span><span>Vazio com miniaturas do próprio produto, título e 1 botão.</span></figcaption></figure>
<figure><img src="30-airbnb-quarto.jpg" loading="lazy"><figcaption><b>Airbnb</b><span class="p">Hospedagem</span><span>Foto, título, números em 3 colunas, preço + botão fixo.</span></figcaption></figure>
<figure><img src="31-atmo-progresso.jpg" loading="lazy"><figcaption><b>Atmo</b><span class="p">Viagem pronta / comemorar</span><span>Fundo escuro com degradê leve, número grande, "continuar / basta por hoje".</span></figcaption></figure>
<figure><img src="32-couplejoy-paywall.jpg" loading="lazy"><figcaption><b>Couple Joy</b><span class="p">Paywall da galera (futuro)</span><span>Plano anual "pra 2 usuários" com preço por pessoa.</span></figcaption></figure></div>
<div id="z" onclick="this.style.display='none'"><img></div>
<script>document.querySelectorAll('.g img').forEach(i=>i.onclick=()=>{const z=document.getElementById('z');z.querySelector('img').src=i.src;z.style.display='flex'})</script></html>
