<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Primeiro uso da Norti</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Protótipo do novo primeiro uso (docs/ONBOARDING-referencias-2026-11-09.md, seção 4.1).
   Só desenho: dá pra clicar, nada é salvo. Dois caminhos: quem organiza (app) e quem foi convidado (web leve). */
:root{--texto:#3B2715;--suave:#7A5F45;--couro:#7B542F;--caramelo:#B97A22;--dourado:#E3A04A;--fundo:#FBF3E6;--areia:#F1E4CF;--chip:#F6EAD7;--borda:#EADCC6;--verde:#5E6B2E;--verde-f:#EEF0DF;--pagina:#E6D8C2;--cartao:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--pagina);font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--texto);padding:24px 16px 48px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.serif{font-family:'Fraunces',serif;font-weight:700;letter-spacing:-.01em}
header.topo{max-width:1040px;margin:0 auto 18px}
header.topo h1{font:700 28px 'Fraunces',serif}
header.topo p{color:var(--suave);font-size:15px;margin-top:6px;line-height:1.45;max-width:760px}
.caminhos{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.caminhos button{padding:10px 16px;border-radius:999px;background:#fff8ee;border:1px solid var(--borda);font-weight:700;font-size:14px}
.caminhos button[aria-pressed=true]{background:var(--couro);color:#F5E9D6;border-color:var(--couro)}
main{max-width:1040px;margin:0 auto;display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap;justify-content:center}

/* celular */
.tela{width:min(340px,100%);height:720px;border-radius:40px;background:var(--fundo);box-shadow:0 18px 40px rgba(74,46,20,.25);border:8px solid #2a1a0c;position:relative;overflow:hidden;display:flex;flex-direction:column}
.barra{height:30px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:12px;font-weight:700;flex:none}
.conteudo{flex:1;display:flex;flex-direction:column;padding:8px 22px 22px;overflow-y:auto}
.progresso{display:flex;gap:6px;margin:6px 0 18px}
.progresso i{flex:1;height:5px;border-radius:5px;background:var(--borda)}
.progresso i.on{background:var(--caramelo)}
.voltar{align-self:flex-start;font-size:13px;color:var(--suave);font-weight:600;padding:4px 0;margin-bottom:4px}
.norti{width:120px;height:120px;object-fit:contain;align-self:center}
.norti.peq{width:76px;height:76px}
h2{font:700 27px/1.1 'Fraunces',serif;margin-bottom:10px}
.sub{color:var(--suave);font-size:15px;line-height:1.45}
.espaco{flex:1}
.botao{display:block;width:100%;padding:16px;border-radius:16px;background:var(--couro);color:#F5E9D6;font-weight:800;font-size:16px;text-align:center;box-shadow:0 8px 20px rgba(123,84,47,.28)}
.botao.verde{background:#25803d;box-shadow:0 8px 20px rgba(37,128,61,.25);color:#fff}
.botao:disabled{opacity:.4;box-shadow:none}
.link{display:block;width:100%;text-align:center;padding:12px;color:var(--suave);font-weight:600;font-size:14px}
.campo{width:100%;padding:15px 16px;border-radius:14px;border:1.5px solid var(--borda);background:#fff;font:600 17px 'Plus Jakarta Sans',sans-serif;color:var(--texto);outline:none}
.campo:focus{border-color:var(--caramelo)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{padding:9px 14px;border-radius:999px;background:var(--chip);font-size:14px;font-weight:600;border:1.5px solid transparent}
.chip[aria-pressed=true]{border-color:var(--caramelo);background:#fbebd2}
.opcao{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:16px;border-radius:16px;background:#fff;border:1.5px solid var(--borda);margin-top:10px}
.opcao[aria-pressed=true]{border-color:var(--caramelo);background:#fffaf2}
.opcao .linha-ic{width:38px;height:38px;border-radius:12px;background:var(--chip);display:grid;place-items:center;flex:none;color:var(--couro)}
.opcao b{display:block;font-size:15px}
.opcao small{color:var(--suave);font-size:13px}
.datas{display:flex;gap:8px;margin-top:12px}
.datas label{flex:1;font-size:12px;color:var(--suave);font-weight:700}
.datas input{margin-top:4px;font-size:15px;padding:12px}
.pessoas{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pessoa{display:flex;align-items:center;gap:6px;padding:6px 12px 6px 6px;border-radius:999px;background:#fff;border:1px solid var(--borda);font-size:14px;font-weight:600}
.rosto{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;flex:none}
.pessoa .rosto{width:26px;height:26px;font-size:11px}
.rosto.vazio{background:var(--chip)!important;color:var(--suave);border:1.5px dashed var(--borda)}
.cartao{background:#fff;border-radius:18px;padding:16px;box-shadow:0 4px 14px rgba(74,46,20,.06)}
.passaporte{background:var(--couro);color:#F5E9D6;border-radius:20px;padding:18px;position:relative;overflow:hidden}
.passaporte small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.75;font-weight:700}
.passaporte h3{font:700 26px/1.1 'Fraunces',serif;margin:6px 0 2px}
.carimbo{position:absolute;right:14px;top:14px;width:84px;height:84px;border-radius:50%;border:3px dashed rgba(245,233,214,.45);display:grid;place-items:center;text-align:center;font:700 11px/1.15 'Plus Jakarta Sans';letter-spacing:.06em;text-transform:uppercase;color:rgba(245,233,214,.6);transform:rotate(-10deg)}
.rostos{display:flex;margin-top:14px}
.rostos .rosto{border:2px solid var(--couro);margin-right:-8px}
.passaporte .rosto.vazio{background:rgba(245,233,214,.12)!important;border:2px dashed rgba(245,233,214,.5);color:#F5E9D6}
.zap{background:#e7ddd0;border-radius:16px;padding:14px;margin-top:14px}
.balao{background:#dcf8c6;border-radius:12px 12px 2px 12px;padding:10px 12px;font-size:14px;line-height:1.4;margin-left:24px;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.balao .preview{background:#fff;border-radius:8px;padding:8px;margin-top:8px;font-size:12px;color:var(--suave)}
.balao .preview b{color:var(--texto);display:block;font-size:13px}
.passo{background:#fbebd2;border:1.5px solid var(--dourado);border-radius:18px;padding:16px}
.passo small{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--caramelo)}
.passo b{display:block;font-size:17px;margin:4px 0 4px}
.passo p{font-size:14px;color:var(--suave);line-height:1.4}
.passo .botao{margin-top:12px;padding:12px;font-size:15px}
.barrinha{height:8px;border-radius:8px;background:rgba(123,84,47,.15);margin-top:10px;overflow:hidden}
.barrinha i{display:block;height:100%;background:var(--caramelo);border-radius:8px}
.linha{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--borda);width:100%;text-align:left}
.linha:last-child{border-bottom:0}
.linha .ic{width:38px;height:38px;border-radius:12px;background:var(--chip);display:grid;place-items:center;flex:none;color:var(--couro)}
.linha b{display:block;font-size:15px}
.linha small{color:var(--suave);font-size:13px}
.linha .seta{margin-left:auto;color:var(--suave)}
.dica{font-size:13px;color:var(--suave);text-align:center;margin-top:14px;line-height:1.4}
.folha-fundo{position:absolute;inset:0;background:rgba(42,26,12,.45);display:flex;align-items:flex-end;animation:sobe-fundo .2s}
.folha{background:var(--fundo);width:100%;border-radius:26px 26px 0 0;padding:12px 22px 24px;animation:sobe .25s ease-out}
.folha .pega{width:40px;height:5px;border-radius:5px;background:var(--borda);margin:0 auto 14px}
.demo{background:#fff;border-radius:16px;padding:14px;margin:14px 0;display:grid;gap:8px}
.demo .g{display:flex;justify-content:space-between;font-size:14px;opacity:0;animation:aparece .4s forwards}
.demo .g:nth-child(2){animation-delay:.6s}.demo .g:nth-child(3){animation-delay:1.2s}
.demo .total{border-top:1px dashed var(--borda);padding-top:8px;font-weight:800;color:var(--verde);opacity:0;animation:aparece .4s 1.9s forwards}
.selo-ok{width:64px;height:64px;border-radius:50%;background:var(--verde-f);color:var(--verde);display:grid;place-items:center;align-self:center;margin-bottom:10px}
@keyframes sobe{from{transform:translateY(100%)}}
@keyframes sobe-fundo{from{opacity:0}}
@keyframes aparece{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* notas do lado */
.notas{flex:1;min-width:260px;max-width:520px}
.notas h3{font:700 20px 'Fraunces',serif;margin-bottom:6px}
.notas .porque{background:#fff8ee;border:1px solid var(--borda);border-radius:16px;padding:16px;font-size:14px;line-height:1.5}
.notas .porque p+p{margin-top:8px}
.notas .ref{color:var(--suave);font-size:13px;margin-top:10px}
.lista{margin-top:18px;display:grid;gap:6px}
.lista button{display:flex;gap:10px;align-items:center;text-align:left;padding:10px 12px;border-radius:12px;font-size:14px;font-weight:600;color:var(--suave)}
.lista button span{width:24px;height:24px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:12px;flex:none}
.lista button[aria-current=true]{background:#fff;color:var(--texto)}
.lista button[aria-current=true] span{background:var(--caramelo);color:#fff}
.conta{margin-top:18px;font-size:13px;color:var(--suave);line-height:1.5}
</style>
</head>
<body>
<header class="topo">
  <h1>Primeiro uso da Norti (rascunho 1)</h1>
  <p>Protótipo clicável do caminho novo. Tudo é exemplo e nada é salvo. A ideia é testar com 3 pessoas que nunca viram a Norti e ver onde travam. Base: <i>docs/ONBOARDING-referencias-2026-11-09.md</i>, seção 4.1.</p>
  <div class="caminhos" role="group" aria-label="Caminho">
    <button id="b-org" aria-pressed="true">Quem organiza (app)</button>
    <button id="b-conv" aria-pressed="false">Quem foi convidado (link)</button>
  </div>
</header>
<main>
  <div class="tela" aria-live="polite">
    <div class="barra"><span>9:41</span><span id="onde">app</span></div>
    <div class="conteudo" id="conteudo"></div>
  </div>
  <section class="notas">
    <h3 id="n-titulo"></h3>
    <div class="porque" id="n-texto"></div>
    <div class="lista" id="lista"></div>
    <p class="conta" id="conta"></p>
  </section>
</main>

// O que a pessoa responde vai aparecendo nas telas seguintes (personalizar).
const d = { destino:'', quando:'', ida:'2026-12-12', volta:'2026-12-15', nomes:[], novo:'', mostrarFolha:false, convNome:'' }
const dataBonita = () => d.quando === 'sei'
  ? `${+d.ida.slice(8)} a ${+d.volta.slice(8)}/${['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][+d.volta.slice(5,7)-1]}`
  : 'Data a combinar'
const lugar = () => d.destino || 'algum lugar'
const iniciais = n => n.trim().split(/\s+/).map(p => p[0]).slice(0,2).join('').toUpperCase()
const rosto = (n,i) => `<span class="rosto" style="background:${CORES[i%CORES.length]}">${iniciais(n)}</span>`
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))
const prog = (n,t) => `<div class="progresso">${Array.from({length:t},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join('')}</div>`

let caminho = 'org', i = 0
const passos = () => caminho === 'org' ? ORG : CONV
function desenhar(){
  const p = passos()[i]
  document.getElementById('conteudo').innerHTML = p.tela()
  document.getElementById('onde').textContent = caminho === 'org' ? 'app' : 'navegador'
  document.getElementById('n-titulo').textContent = p.titulo
  document.getElementById('n-texto').innerHTML = p.porque + `<p class="ref">${p.ref}</p>`
  document.getElementById('lista').innerHTML = passos().map((x,k)=>`<button data-pular="${k}" aria-current="${k===i}"><span>${k+1}</span>${x.nome}</button>`).join('')
  document.getElementById('conta').textContent = caminho === 'org'
    ? `${ORG.length} telas até a viagem pronta (média de apps de viagem: 16,6). Conta só na tela 6.`
    : `${CONV.length} telas, 1 pergunta, nada pra instalar.`
  document.getElementById('b-org').setAttribute('aria-pressed', caminho==='org')
  document.getElementById('b-conv').setAttribute('aria-pressed', caminho==='conv')
}
function ir(v){
  const max = passos().length - 1
  i = v === '+1' ? Math.min(i+1,max) : v === '-1' ? Math.max(i-1,0) : +v
  d.mostrarFolha = false
  desenhar()
}
document.addEventListener('click', e => {
  const b = e.target.closest('button,.folha-fundo'); if(!b) return
  if (b.dataset.caminho) { caminho = b.dataset.caminho; i = 0; return desenhar() }
  if (b.id === 'b-org' || b.id === 'b-conv') { caminho = b.id === 'b-org' ? 'org' : 'conv'; i = 0; return desenhar() }
  if (b.dataset.pular !== undefined) return ir(b.dataset.pular)
  if (b.dataset.destino !== undefined) { d.destino = b.dataset.destino; if (!b.dataset.ir) return desenhar() }
  if (b.dataset.quando) { d.quando = b.dataset.quando; return desenhar() }
  if (b.id === 'add') { const n = d.novo.trim(); if (n) { d.nomes.push(n); d.novo = '' } desenhar(); document.getElementById('novo')?.focus(); return }
  if (b.id === 'contas') { d.mostrarFolha = true; return desenhar() }
  if (b.id === 'fecha' || b.id === 'fecha2' || b.id === 'fecha3') { d.mostrarFolha = false; return desenhar() }
  if (b.dataset.ir) ir(b.dataset.ir)
})
document.addEventListener('input', e => {
  const t = e.target
  if (t.id === 'destino') { d.destino = t.value.trim(); document.getElementById('seguir').disabled = !d.destino; document.querySelectorAll('[data-destino]').forEach(c=>c.setAttribute('aria-pressed', c.dataset.destino===d.destino && !!d.destino)) }
  if (t.id === 'ida') d.ida = t.value
  if (t.id === 'volta') d.volta = t.value
  if (t.id === 'novo') d.novo = t.value
  if (t.id === 'convNome') { d.convNome = t.value.trim(); document.getElementById('seguir').disabled = !d.convNome }
})
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'novo') document.getElementById('add').click() })
desenhar()
</script>
